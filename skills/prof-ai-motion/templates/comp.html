<!doctype html>
<!--
  PROF AI Motion — стартовая композиция. Кадр = функция времени.
  Контракт: window.renderFrame(t, rt) выставляет всё состояние кадра; window.ready — шрифты и картинки готовы.
  Никаких CSS-анимаций, transition, requestAnimationFrame и Date.now(): только t.
  Размер кадра: поменяй W/H ниже, в CSS (html,body) и у canvas.
-->
<html lang="ru"><head><meta charset="utf-8">
<link rel="stylesheet" href="assets/fonts/fonts.css">
<script type="importmap">{"imports":{"three":"./assets/three/three.module.js","three/addons/":"./assets/three/addons/"}}</script>
<style>
:root{--bg:#050505;--ink:#F2F0EA;--mut:rgba(242,240,234,.56);--blue:#8FB4FF;--vio:#B99BFF;--hot:#FF7A45}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:1080px;height:1920px;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Golos Text",sans-serif}
#stage{position:absolute;inset:0;overflow:hidden}
canvas{position:absolute;inset:0}
#bg{z-index:1}#gl{z-index:2}#fx{z-index:6}
.sc{position:absolute;inset:0;display:none;z-index:4}          /* сцены скрываются через display, не visibility */
.u{font-family:Unbounded,sans-serif;font-weight:900;text-transform:uppercase;line-height:.96;letter-spacing:-.02em}
.mono{font-family:"PT Mono",monospace;letter-spacing:.14em;text-transform:uppercase}
.grad{background:linear-gradient(92deg,#A9C8FF 0%,#7B8CFF 45%,#C9A4FF 100%);-webkit-background-clip:text;background-clip:text;color:transparent}
.ctr{position:absolute;left:0;right:0;text-align:center}
.ab{position:absolute}
.pill{display:inline-flex;align-items:center;gap:14px;padding:12px 22px;border-radius:99px;background:rgba(255,255,255,.06);box-shadow:inset 0 0 0 1px rgba(255,255,255,.12);font-size:22px}
.pill i{width:10px;height:10px;border-radius:50%;background:var(--blue);box-shadow:0 0 14px var(--blue)}
.shell{padding:10px;border-radius:44px;background:rgba(255,255,255,.04);box-shadow:inset 0 0 0 1px rgba(255,255,255,.10)}   /* двойная оправа: внешний слой */
.core{border-radius:34px;background:rgba(14,14,18,.78);box-shadow:inset 0 1px 1px rgba(255,255,255,.14);overflow:hidden}      /* и ядро */
#grain{position:absolute;inset:0;z-index:8;mix-blend-mode:overlay;opacity:.08;background-size:540px 960px;pointer-events:none}
#flash{position:absolute;inset:0;background:#fff;z-index:7;opacity:0}
/* сцены демо */
#w1,#w2{font-size:90px}#w3{font-size:170px}
#card{left:64px;right:64px;top:720px}
#card .core{padding:48px}
#card h2{font-size:64px;margin:26px 0 22px}
#card p{font-size:34px;line-height:1.35;color:var(--mut)}
#logo{top:760px;font-family:"DM Serif Display",serif;font-style:italic;font-size:200px;line-height:1}
#sign{top:1040px}
</style></head><body>
<div id="stage">
  <canvas id="bg" width="1080" height="1920"></canvas>
  <canvas id="gl" width="1080" height="1920"></canvas>

  <div class="sc" id="S1">
    <div class="ctr u" id="w1" style="top:300px">Это</div>
    <div class="ctr u" id="w2" style="top:410px">моушн</div>
    <div class="ctr u grad" id="w3" style="top:530px">кодом</div>
  </div>

  <div class="sc" id="S2">
    <div class="ab shell" id="card"><div class="core">
      <div class="pill mono"><i></i>01 / 03</div>
      <h2 class="u">Кадр = <span class="grad">функция</span> времени</h2>
      <p id="p1">Каждый кадр — HTML-страница.</p>
      <p id="p2">Браузер снимает её 30 раз в секунду.</p>
      <p id="p3">ffmpeg склеивает кадры в MP4.</p>
    </div></div>
  </div>

  <div class="sc" id="S3">
    <div class="ctr" id="logo">prof ai</div>
    <div class="ctr" id="sign"><span class="pill mono"><i></i>сделано по скиллу PROF AI Motion</span></div>
  </div>

  <canvas id="fx" width="1080" height="1920"></canvas>
  <div id="flash"></div>
  <div id="grain"></div>
</div>

<script type="module">
import * as THREE from 'three';
import { FontLoader } from 'three/addons/loaders/FontLoader.js';
import { TextGeometry } from 'three/addons/geometries/TextGeometry.js';

const W=1080, H=1920;
const $=id=>document.getElementById(id);
const clamp=(x,a=0,b=1)=>Math.min(b,Math.max(a,x));
const lerp=(a,b,k)=>a+(b-a)*k;
const prog=(t,a,d)=>clamp((t-a)/d);
function hash(n){n=Math.sin(n*127.1+311.7)*43758.5453;return n-Math.floor(n)}   // посеянная случайность
function bez(x1,y1,x2,y2){const cx=3*x1,bx=3*(x2-x1)-cx,ax=1-cx-bx,cy=3*y1,by=3*(y2-y1)-cy,ay=1-cy-by;
  const sx=t=>((ax*t+bx)*t+cx)*t,sy=t=>((ay*t+by)*t+cy)*t,dx=t=>(3*ax*t+2*bx)*t+cx;
  return x=>{x=clamp(x);let t=x;for(let i=0;i<8;i++){const e=sx(t)-x;if(Math.abs(e)<1e-5)break;const d=dx(t);if(Math.abs(d)<1e-6)break;t-=e/d}return sy(clamp(t))}}
const eOut=bez(.23,1,.32,1), eIO=bez(.77,0,.175,1);
const eBack=x=>{x=clamp(x);const c1=1.7,c3=c1+1;return 1+c3*Math.pow(x-1,3)+c1*Math.pow(x-1,2)};
const show=(id,on)=>{$(id).style.display=on?'block':'none'};
const S=(el,o)=>{for(const k in o)el.style[k]=o[k]};
function enter(el,t,t0,d=.45,dy=50){const p=eOut(prog(t,t0,d));S(el,{opacity:t<t0?0:p,transform:`translateY(${(1-p)*dy}px) scale(${lerp(.92,1,p)})`,filter:`blur(${(1-p)*14}px)`});return p}
function exitq(el,t,t0,d=.16){if(t<t0)return;const p=prog(t,t0,d);el.style.opacity=(+el.style.opacity||1)*(1-p);el.style.filter=`blur(${p*16}px)`}
function slam(el,t,t0,from=1.6){const p=eOut(prog(t,t0,.22));S(el,{opacity:t<t0?0:Math.min(1,p*2.5),transform:`scale(${lerp(from,1,p)})`,filter:`blur(${(1-p)*12}px)`})}

// фон: мягкие светящиеся пятна
const bg=$('bg').getContext('2d'), fx=$('fx').getContext('2d');
function orbs(t,a=1){bg.fillStyle='#050505';bg.fillRect(0,0,W,H);
  for(const [x,y,r,c,s] of [[W*.25,H*.27,760,'120,140,255',.7],[W*.8,H*.73,820,'170,120,255',.9],[W*.55,H*.52,500,'80,160,255',.5]]){
    const X=x+Math.sin(t*.4*s)*80,Y=y+Math.cos(t*.3*s)*60;const g=bg.createRadialGradient(X,Y,0,X,Y,r);g.addColorStop(0,`rgba(${c},${.22*a})`);g.addColorStop(1,`rgba(${c},0)`);bg.fillStyle=g;bg.fillRect(0,0,W,H)}}
// зерно
const grains=[0,1,2,3].map(k=>{const c=document.createElement('canvas');c.width=W/2;c.height=H/2;const g=c.getContext('2d');const d=g.createImageData(c.width,c.height);for(let i=0;i<d.data.length;i+=4){const v=hash(i*.37+k*1000)*255;d.data[i]=d.data[i+1]=d.data[i+2]=v;d.data[i+3]=255}g.putImageData(d,0,0);return c.toDataURL('image/jpeg',.7)});
// кэш картинок (для кадров видео: img(`assets/clip/${n}.jpg`).p)
const cache=new Map();
function img(src){let e=cache.get(src);if(!e){const im=new Image();im.src=src;e={im,p:im.decode().then(()=>im).catch(()=>im)};cache.set(src,e);if(cache.size>200)cache.delete(cache.keys().next().value)}return e}

// 3D: хром в тёмной студии
const R=new THREE.WebGLRenderer({canvas:$('gl'),antialias:true,alpha:true,preserveDrawingBuffer:true});
R.setPixelRatio(1);R.setSize(W,H,false);R.toneMapping=THREE.ACESFilmicToneMapping;R.toneMappingExposure=1.5;R.outputColorSpace=THREE.SRGBColorSpace;R.setClearColor(0,0);
const scene=new THREE.Scene();
{const env=new THREE.Scene();env.add(new THREE.Mesh(new THREE.SphereGeometry(50,32,16),new THREE.MeshBasicMaterial({color:0x030306,side:THREE.BackSide})));
  const strip=(w,h,c,pos)=>{const m=new THREE.Mesh(new THREE.PlaneGeometry(w,h),new THREE.MeshBasicMaterial({color:new THREE.Color(...c),side:THREE.DoubleSide}));m.position.set(...pos);m.lookAt(0,0,0);env.add(m)};
  strip(40,2.2,[9,9,10],[0,14,6]);strip(2.4,30,[1.6,2.6,9],[-16,0,4]);strip(2.4,30,[6,2.6,9],[16,0,4]);strip(30,1.2,[4,4,5],[0,-12,10]);
  scene.environment=new THREE.PMREMGenerator(R).fromScene(env,.015).texture;}
const cam=new THREE.PerspectiveCamera(35,W/H,.1,400);cam.position.set(0,0,24);
const chrome=new THREE.MeshPhysicalMaterial({color:0xffffff,metalness:1,roughness:.08,iridescence:.9,iridescenceIOR:1.8,clearcoat:1});
const sweep=new THREE.PointLight(0xffffff,0,40);scene.add(sweep);
const font=await new Promise(r=>new FontLoader().load('assets/three/helvetiker_bold.typeface.json',r));
const tg=new TextGeometry('MOTION',{font,size:2,depth:.7,curveSegments:12,bevelEnabled:true,bevelThickness:.1,bevelSize:.07,bevelSegments:8});tg.center();
const m3=new THREE.Mesh(tg,chrome);{tg.computeBoundingBox();const b=tg.boundingBox;m3.scale.setScalar(7.4/(b.max.x-b.min.x))}scene.add(m3);

window.renderFrame=async(t,rt=t)=>{
  const fr=Math.round(rt*30);
  $('grain').style.backgroundImage=`url(${grains[fr%4]})`;
  for(const id of ['S1','S2','S3'])show(id,false);
  fx.clearRect(0,0,W,H);m3.visible=false;sweep.intensity=0;let use3D=false;
  // вспышка на склейках
  let fl=0;for(const c of [3.0,5.5]){const d=t-c;if(d>=0&&d<.2)fl=Math.max(fl,(1-d/.2)*.5)}$('flash').style.opacity=fl;

  // S1 0–3.0: удары слов на долях + 3D-хром прилетает
  if(t<3.0){orbs(t);show('S1',true);slam($('w1'),t,0);slam($('w2'),t,.5);slam($('w3'),t,1.0,2.2);
    use3D=true;m3.visible=true;const p=eOut(prog(t,1.0,1.0));m3.position.set(0,-2.4,lerp(-150,0,p));m3.rotation.set(lerp(.5,.08,p),lerp(Math.PI*1.6,-.1,p),0);
    sweep.intensity=t>=2?260:0;sweep.position.set(lerp(-9,9,eIO(prog(t,2.0,.8))),-2,5);
    if(t>2.84)for(const id of['w1','w2','w3'])exitq($(id),t,2.84);}
  // S2 3.0–5.5: стеклянная карточка, каскад строк
  if(t>=3.0&&t<5.5){orbs(t,.8);show('S2',true);enter($('card'),t,3.0,.5,80);
    ['p1','p2','p3'].forEach((id,i)=>enter($(id),t,3.35+i*.06,.4,24));if(t>5.34)exitq($('card'),t,5.34);}
  // S3 5.5–8.0: финал
  if(t>=5.5){orbs(t);show('S3',true);enter($('logo'),t,5.55,.5,30);enter($('sign'),t,5.8,.45,20);}

  if(use3D)R.render(scene,cam);else R.clear();
};
window.ready=(async()=>{await document.fonts.load('900 100px Unbounded');await document.fonts.load('italic 100px "DM Serif Display"');await document.fonts.load('100px "PT Mono"');await document.fonts.ready;})();
</script>
</body></html>
